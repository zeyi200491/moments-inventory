weflow:
  base_url: "http://127.0.0.1:5031"
  timeout_seconds: 20
  access_token: ""

task:
  days: 30
  merge_window_minutes: 10
  output_dir: "./output"

targets:
  - remark_name: "张三"
    wxid: "wxid_123"
  - remark_name: "李四"
    wxid: "wxid_456"

rules:
  required_fields:
    - model
    - price
    - serial_no

paths:
  sqlite_db: "../data/inventory.db"
  model_dict: "./models.txt"

warmup:
  enabled: false
  start_page: "contacts"
  search_delay_ms: 800
  open_profile_delay_ms: 1000
  open_timeline_delay_ms: 1200
  scroll_count: 4
  scroll_delay_ms: 900
  back_delay_ms: 600
  max_consecutive_failures: 3
  min_success_count: 1
  auto_export_on_success: true
