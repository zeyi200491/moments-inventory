[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moments-inventory"
dynamic = ["version"]
description = "微信朋友圈内容盘点工具。"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AIkefu" },
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "playwright>=1.45.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.1",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "uvicorn>=0.30.0",
]

[project.scripts]
moments-inventory = "moments_inventory:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "moments_inventory.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
